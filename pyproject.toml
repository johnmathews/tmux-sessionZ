[project]
name = "tmux-config"
version = "0.1.0"
description = "Test suite for the sessionX picker in this tmux configuration"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "coverage>=7.6", "ruff>=0.7"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]
ignore = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
